name: Daily WOS Data Auto-Sync

on:
  schedule:
    # Runs everyday at 05:00 UTC
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-game-data:
    name: 🔄 Daily Auto-Sync Game Data & Codes
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: ❄️ Run Automated Data Sync
        run: |
          python sync_data.py

      - name: 🚀 Commit & Push Updated Data Files (if changed)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add utility_data.json state_timeline.json heroes_data.json
          
          if git diff --staged --quiet; then
            echo "✨ No data changes detected. All files are already up-to-date."
          else
            echo "💾 Changes detected! Committing and pushing fresh game data..."
            git commit -m "chore(sync): automated daily update of utility_data.json, state_timeline.json, and heroes_data.json [skip ci]"
            git push origin main
            echo "✅ Successfully synced fresh game data to main branch!"
          fi
