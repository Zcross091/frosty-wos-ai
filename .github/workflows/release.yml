name: Build & Release Multi-Platform Binaries

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release Version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

concurrency:
  group: "release-build"
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # 1. Android Release Build
  # -------------------------------------------------------------
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🎯 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        working-directory: device/mobile
        run: flutter pub get

      - name: 🚀 Build Release APK
        working-directory: device/mobile
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: 📤 Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: device/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # -------------------------------------------------------------
  # 2. Windows Desktop Build
  # -------------------------------------------------------------
  build-windows:
    name: 🪟 Build Windows Desktop (x64)
    runs-on: windows-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🎯 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: ⚙️ Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: 📦 Install Flutter Dependencies
        working-directory: device/mobile
        run: flutter pub get

      - name: 🚀 Build Windows Release
        working-directory: device/mobile
        run: flutter build windows --release

      - name: 📦 Archive Windows Bundle
        shell: pwsh
        run: |
          Compress-Archive -Path device/mobile/build/windows/x64/runner/Release/* -DestinationPath frosty-wos-ai-windows-x64.zip

      - name: 📤 Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: frosty-wos-ai-windows-x64.zip
          if-no-files-found: error

  # -------------------------------------------------------------
  # 3. Linux Desktop Build
  # -------------------------------------------------------------
  build-linux:
    name: 🐧 Build Linux Desktop (x64)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Install Linux Build Tools & GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: 🎯 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: ⚙️ Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: 📦 Install Flutter Dependencies
        working-directory: device/mobile
        run: flutter pub get

      - name: 🚀 Build Linux Release
        working-directory: device/mobile
        run: flutter build linux --release

      - name: 📦 Archive Linux Bundle
        run: |
          tar -czf frosty-wos-ai-linux-x64.tar.gz -C device/mobile/build/linux/x64/release/bundle .

      - name: 📤 Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-tar
          path: frosty-wos-ai-linux-x64.tar.gz
          if-no-files-found: error

  # -------------------------------------------------------------
  # 4. Consolidated GitHub Release Publication
  # -------------------------------------------------------------
  publish-release:
    name: 🚀 Publish Multi-Platform GitHub Release
    needs: [build-android, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🏷️ Determine Version Tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.version_name }}" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=v1.0.${{ github.run_number }}" >> $GITHUB_ENV
          fi

      - name: 📥 Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-output/
          merge-multiple: true

      - name: 📦 Rename & Organize Packages
        run: |
          mkdir -p final-release/
          if [ -f release-output/app-release.apk ]; then
            mv release-output/app-release.apk final-release/frosty-wos-ai-android-${{ env.TAG_NAME }}.apk
          fi
          if [ -f release-output/frosty-wos-ai-windows-x64.zip ]; then
            mv release-output/frosty-wos-ai-windows-x64.zip final-release/frosty-wos-ai-windows-x64-${{ env.TAG_NAME }}.zip
          fi
          if [ -f release-output/frosty-wos-ai-linux-x64.tar.gz ]; then
            mv release-output/frosty-wos-ai-linux-x64.tar.gz final-release/frosty-wos-ai-linux-x64-${{ env.TAG_NAME }}.tar.gz
          fi
          ls -la final-release/

      - name: 🌟 Create Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ❄️ Frosty WOS AI ${{ env.TAG_NAME }} (Cross-Platform)
          draft: false
          prerelease: false
          files: final-release/*
          body: |
            ## ❄️ Frosty Whiteout Survival Tactical AI (${{ env.TAG_NAME }})

            Cross-platform tactical oracle and grandmaster companion for Whiteout Survival Chiefs worldwide.

            ### 📦 Download Packages by Platform:
            * 📱 **Android:** `frosty-wos-ai-android-${{ env.TAG_NAME }}.apk` (Install directly on Android devices)
            * 🪟 **Windows Desktop:** `frosty-wos-ai-windows-x64-${{ env.TAG_NAME }}.zip` (Extract and run `frosty_wos_ai.exe`)
            * 🐧 **Linux Desktop:** `frosty-wos-ai-linux-x64-${{ env.TAG_NAME }}.tar.gz` (Extract and run `./frosty_wos_ai`)
            * 🍎 **iOS & macOS:** Source build targets available in repository (`device/mobile/ios` and `device/mobile/macos`)

            ### 🌟 Key Capabilities:
            * 💬 **Live Tactical AI Chat:** Powered by **Google Gemini 3.6 Flash / Groq / Local Ollama** with real-time cooking typing indicators.
            * ⏱️ **Offline State Age & Generation Calculator:** Compute exact server age, active hero generation, countdown to next gen, and tactical shard roadmaps.
            * 📖 **Offline Hero Codex (Gen 0–16+):** Complete offline database for heroes (Seigel, Aisling, Ursar, Bradley, Edith, Flint, etc.) with stats and F2P/P2W advice.
            * 📊 **Troop Formations & Lineups:** Interactive 50/20/30, 10/10/80 Bear Trap, and 60/20/20 Garrison calculators with march capacity sliders.
            * 🌟 **Community & GitHub Hub:** Made by **StateCraft** with direct issue reporting, star, fork, and Discord bot invite links.
