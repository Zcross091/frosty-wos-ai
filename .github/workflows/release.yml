name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release Version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

concurrency:
  group: "android-release"
  cancel-in-progress: false

jobs:
  build-and-release-android:
    name: 📱 Build & Publish Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🎯 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        working-directory: device/mobile
        run: flutter pub get

      - name: 🧪 Run Code Integrity Tests
        working-directory: device/mobile
        run: flutter test

      - name: 🏷️ Determine Version Tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          CLEAN_VER=$(echo "$TAG" | sed 's/^v//')
          echo "TAG_NAME=${TAG}" >> $GITHUB_ENV
          echo "APP_VER=${CLEAN_VER}" >> $GITHUB_ENV
          echo "Determined Version: $TAG (Clean: $CLEAN_VER)"

      - name: 🚀 Build Android Release APK (Signed with Permanent Keystore)
        working-directory: device/mobile
        run: |
          flutter build apk --release \
            --build-name="${{ env.APP_VER }}" \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_VERSION="${{ env.APP_VER }}" \
            --android-skip-build-dependency-validation

      - name: 📦 Prepare APK Package
        run: |
          mkdir -p release-output
          cp device/mobile/build/app/outputs/flutter-apk/app-release.apk release-output/frosty-wos-ai-android-${{ env.TAG_NAME }}.apk
          ls -la release-output/

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frosty-android-apk-${{ env.TAG_NAME }}
          path: release-output/frosty-wos-ai-android-${{ env.TAG_NAME }}.apk

      - name: 🌟 Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ❄️ Frosty WOS AI Android ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          files: release-output/frosty-wos-ai-android-${{ env.TAG_NAME }}.apk
          body: |
            ## ❄️ Frosty Whiteout Survival Tactical AI Mobile (${{ env.TAG_NAME }})

            The official Android tactical oracle companion for Whiteout Survival Chiefs worldwide.

            ### 📱 What's Inside:
            * 💬 **Live Tactical AI Chat:** Powered by **Google Gemini 3.6 Flash / Groq / Local Ollama** with real-time cooking typing indicators.
            * ⏱️ **Offline State Age & Generation Calculator:** Compute exact server age, active hero generation, countdown to next gen, and tactical shard-saving roadmaps.
            * 📖 **Offline Hero Codex (Gen 0–16+):** Complete offline database for heroes (Seigel, Aisling, Ursar, Bradley, Edith, Flint, etc.) with stats and F2P/P2W star advice.
            * 📊 **Troop Formations & Lineups:** Interactive 50/20/30, 10/10/80 Bear Trap, and 60/20/20 Garrison calculators with march capacity sliders.
            * 🚀 **In-App Updater:** Automatically notifies you when a new version is released on GitHub.
            * 🌟 **Community & GitHub Hub:** Made by **StateCraft** with direct issue reporting, star, fork, and Discord bot invite links.

            ### 📥 Download & Install:
            Download the **`frosty-wos-ai-android-${{ env.TAG_NAME }}.apk`** attached below and install it directly on your Android phone/tablet!
